services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-poddar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-poddar_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-poddar_jewellers}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-poddar}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-poddar}:${POSTGRES_PASSWORD:-poddar_secret_2026}@db:5432/${POSTGRES_DB:-poddar_jewellers}?schema=public
      SESSION_SECRET: ${SESSION_SECRET:-change_this_secret_in_production_32_chars_long}
      UPLOAD_DIR: /app/public/uploads
    volumes:
      - uploads:/app/public/uploads
    ports:
      - "${APP_PORT:-3210}:3000"

  # One-shot. Run explicitly or via deploy.sh:
  #   docker compose run --rm migrate
  migrate:
    build:
      context: .
      target: builder
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-poddar}:${POSTGRES_PASSWORD:-poddar_secret_2026}@db:5432/${POSTGRES_DB:-poddar_jewellers}?schema=public
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin123}
    command: sh -c "npx prisma migrate deploy && npx tsx prisma/seed.ts"

volumes:
  pgdata:
  uploads:

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 10.88.99.0/24

